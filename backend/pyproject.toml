[project]
name = "parking-occupancy-backend"
version = "0.1.0"
description = "Smart Parking Occupancy Detector — backend (API + worker)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # GUI-enabled build: scripts/annotate_spots.py needs cv2.imshow for
    # interactive local use. Containers run headless and don't open a
    # window — revisit opencv-python vs. opencv-python-headless there.
    "opencv-python>=4.10",
    "numpy>=1.26",
    "ultralytics>=8.3",
    # Pinned to supervision.ByteTrack specifically. It's deprecated
    # as of 0.28 in favor of the separate `trackers` package's
    # ByteTrackTracker (renamed update() method) and slated for removal in
    # 0.31 — pinned below that until the project deliberately migrates.
    "supervision>=0.24,<0.31",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate always emits long op.create_index(...) lines; the
# rest of its output already passes lint after `ruff check --fix`.
"app/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
